name: DHIE campaign validation

on:
  push:
    paths:
      - "experience/**"
      - ".github/workflows/dhie-campaign-validation.yml"
  pull_request:
    paths:
      - "experience/**"
      - ".github/workflows/dhie-campaign-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  campaign-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test dependency
        run: npm install --no-save playwright
        working-directory: experience
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: experience
      - name: Run Chapter 1 doctrine investigation regression tests
        run: node --test tests/dhie-chapter1-doctrine.test.mjs
        working-directory: experience
      - name: Run Chapter 1 source study regression tests
        run: node --test tests/dhie-chapter1.test.mjs
        working-directory: experience
      - name: Run Homo Optima creation regression tests
        run: node --test tests/dhie-creation.test.mjs
        working-directory: experience
      - name: Run DHIE campaign regression tests
        run: node --test tests/dhie-campaign.test.mjs
        working-directory: experience
      - name: Run Chapter 2 power audit regression tests
        run: node --test tests/dhie-chapter2.test.mjs
        working-directory: experience
      - name: Run Chapter 3 privacy audit regression tests
        run: node --test tests/dhie-chapter3.test.mjs
        working-directory: experience
      - name: Run Chapter 4 cognitive freedom regression tests
        run: node --test tests/dhie-chapter4.test.mjs
        working-directory: experience
      - name: Run Chapter 5 emotional autonomy regression tests
        run: node --test tests/dhie-chapter5.test.mjs
        working-directory: experience
      - name: Run Chapter 6 creative freedom regression tests
        run: node --test tests/dhie-chapter6.test.mjs
        working-directory: experience
      - name: Run Chapter 1 doctrine investigation Chromium test
        run: node --test tests/dhie-chapter1-doctrine-browser.test.mjs
        working-directory: experience
      - name: Run Chapter 1 source study Chromium test
        run: node --test tests/dhie-chapter1-browser.test.mjs
        working-directory: experience
      - name: Run Homo Optima creation Chromium test
        run: node --test tests/dhie-creation-browser.test.mjs
        working-directory: experience
      - name: Run Chromium end-to-end smoke test
        run: node --test tests/dhie-browser.test.mjs
        working-directory: experience
      - name: Run Chapter 2 power audit Chromium test
        run: node --test tests/dhie-chapter2-browser.test.mjs
        working-directory: experience
      - name: Run Chapter 3 privacy audit Chromium test
        run: node --test tests/dhie-chapter3-browser.test.mjs
        working-directory: experience
      - name: Run Chapter 4 cognitive freedom Chromium test
        run: node --test tests/dhie-chapter4-browser.test.mjs
        working-directory: experience
      - name: Run Chapter 5 emotional autonomy Chromium test
        run: node --test tests/dhie-chapter5-browser.test.mjs
        working-directory: experience
      - name: Run Chapter 6 creative freedom Chromium test
        run: node --test tests/dhie-chapter6-browser.test.mjs
        working-directory: experience
      - name: Wait for this commit to reach GitHub Pages
        run: |
          node --input-type=module <<'NODE'
          const base = "https://cicangeorgealin.github.io/Department-of-Human-Intelligence-and-Evolution/experience/";
          const checks = [
            ["creation.html", "chapterOneProgress"],
            ["chapter2.html", "THE LABYRINTH"],
            ["chapter3.html", "THE PANOPTICON"],
            ["chapter4.html", "COGNITIVE"],
            ["chapter5.html", "EMOTIONAL"],
            ["chapter6.html", "CREATIVE"]
          ];
          const deadline = Date.now() + 300000;
          while (Date.now() < deadline) {
            const results = await Promise.all(checks.map(async ([path, marker]) => {
              try {
                const response = await fetch(base + path + "?deploy-check=" + Date.now(), { cache: "no-store" });
                return response.ok && (await response.text()).includes(marker);
              } catch { return false; }
            }));
            if (results.every(Boolean)) {
              console.log("GitHub Pages contains the new Creation Project progress and Chapter 2 page.");
              process.exit(0);
            }
            console.log("Waiting for GitHub Pages to publish this commit...");
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          throw new Error("GitHub Pages did not publish the expected files within five minutes.");
          NODE
      - name: Run published Chapter 1 doctrine investigation Chromium test
        run: node --test tests/dhie-chapter1-doctrine-browser.test.mjs
        working-directory: experience
        env:
          DHIE_BASE_URL: https://cicangeorgealin.github.io/Department-of-Human-Intelligence-and-Evolution/experience/
      - name: Run published Chapter 1 source study Chromium test
        run: node --test tests/dhie-chapter1-browser.test.mjs
        working-directory: experience
        env:
          DHIE_BASE_URL: https://cicangeorgealin.github.io/Department-of-Human-Intelligence-and-Evolution/experience/
      - name: Run published Homo Optima creation Chromium test
        run: node --test tests/dhie-creation-browser.test.mjs
        working-directory: experience
        env:
          DHIE_BASE_URL: https://cicangeorgealin.github.io/Department-of-Human-Intelligence-and-Evolution/experience/
      - name: Run published Chapter 2 power audit Chromium test
        run: node --test tests/dhie-chapter2-browser.test.mjs
        working-directory: experience
        env:
          DHIE_BASE_URL: https://cicangeorgealin.github.io/Department-of-Human-Intelligence-and-Evolution/experience/
      - name: Run published Chapter 3 privacy audit Chromium test
        run: node --test tests/dhie-chapter3-browser.test.mjs
        working-directory: experience
        env:
          DHIE_BASE_URL: https://cicangeorgealin.github.io/Department-of-Human-Intelligence-and-Evolution/experience/
      - name: Run published Chapter 4 cognitive freedom Chromium test
        run: node --test tests/dhie-chapter4-browser.test.mjs
        working-directory: experience
        env:
          DHIE_BASE_URL: https://cicangeorgealin.github.io/Department-of-Human-Intelligence-and-Evolution/experience/
      - name: Run published Chapter 5 emotional autonomy Chromium test
        run: node --test tests/dhie-chapter5-browser.test.mjs
        working-directory: experience
        env:
          DHIE_BASE_URL: https://cicangeorgealin.github.io/Department-of-Human-Intelligence-and-Evolution/experience/
      - name: Run published Chapter 6 creative freedom Chromium test
        run: node --test tests/dhie-chapter6-browser.test.mjs
        working-directory: experience
        env:
          DHIE_BASE_URL: https://cicangeorgealin.github.io/Department-of-Human-Intelligence-and-Evolution/experience/
      - name: Run published GitHub Pages Chromium smoke test
        run: node --test tests/dhie-browser.test.mjs
        working-directory: experience
        env:
          DHIE_BASE_URL: https://cicangeorgealin.github.io/Department-of-Human-Intelligence-and-Evolution/experience/
